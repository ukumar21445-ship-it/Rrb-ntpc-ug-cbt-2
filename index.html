<style>

<script>
// ===== QUESTION BANK =====  s: 0=General Awareness, 1=Mathematics, 2=Reasoning | n: original Q no. | h: Hindi | e: English | ho/eo: options | a: correct index (0-3)
// Aur questions isi format me is array me jodo.
const Q=[
{s:0,n:3,h:"भारत में एक शीर्ष शिकारी के संरक्षण के लिए 1973 में निम्नलिखित में से कौन-सी वन्यजीव संरक्षण पहल शुरू की गई थी?",e:"Which wildlife conservation initiative was launched in 1973 to protect an apex predator in India?",ho:["प्रोजेक्ट एलिफेंट","प्रोजेक्ट टाइगर","प्रोजेक्ट क्रोकोडाइल","प्रोजेक्ट स्नो लेपर्ड"],eo:["Project Elephant","Project Tiger","Project Crocodile","Project Snow Leopard"],a:1},
{s:0,n:16,h:"हाइड्रोजन और ऑक्सीजन मिलकर जल का निर्माण करते हैं। निम्नलिखित में से किस नियम के अनुसार, जल में हाइड्रोजन और ऑक्सीजन सदैव द्रव्यमान के आधार पर एक निश्चित अनुपात में होते हैं?",e:"Hydrogen and oxygen combine to form water. According to which law are they always in a fixed ratio by mass in water?",ho:["स्थिर अनुपात का नियम","बॉयल का नियम","गुणित अनुपात का नियम","आवोगाद्रो का नियम"],eo:["Law of Definite Proportions","Boyle’s Law","Law of Multiple Proportions","Avogadro’s Law"],a:0},
{s:0,n:31,h:"भोजन बनाते समय बेकिंग सोडा की नींबू के रस अथवा सिरके के साथ अभिक्रिया होने पर कौन-सी गैस उत्सर्जित होती है?",e:"Which gas is released when baking soda reacts with lemon juice or vinegar while cooking?",ho:["हाइड्रोजन","कार्बन डाइऑक्साइड","नाइट्रोजन","ऑक्सीजन"],eo:["Hydrogen","Carbon dioxide","Nitrogen","Oxygen"],a:1},
{s:0,n:33,h:"रक्षा, रेलवे और आय-कर जैसे विषय, भारतीय संविधान की किस सूची के अंतर्गत आते हैं?",e:"Subjects like defence, railways and income tax fall under which list of the Indian Constitution?",ho:["संघ सूची","समवर्ती सूची","राज्य सूची","अवशिष्ट सूची"],eo:["Union List","Concurrent List","State List","Residuary List"],a:0},
{s:0,n:40,h:"ICC चैंपियंस ट्रॉफी किस चक्रीय प्रारूप (cyclical format) में आयोजित की जाती है?",e:"In which cyclical format is the ICC Champions Trophy held?",ho:["प्रत्येक 2 वर्ष में","प्रत्येक 5 वर्ष में","प्रत्येक 4 वर्ष में","प्रत्येक 6 वर्ष में"],eo:["Every 2 years","Every 5 years","Every 4 years","Every 6 years"],a:2},
{s:0,n:1,h:"निम्नलिखित में से कौन-सा विकल्प, शेरशाह सूरी के अधीन विकसित सड़क नेटवर्क के प्रशासनिक महत्व का सर्वोत्तम वर्णन करता है?",ho:["सरायों ने कर एकत्र किया और सैन्य छावनियों के रूप में कार्य किया","कोस मीनारों (Kos minar) में संदेशवाहक ठहरते थे और ये राजस्व कार्यालयों के रूप में भी काम करती थीं","डाक चौकियों ने अनाज का भंडारण किया और बाजार केंद्रों के रूप में कार्य किया","सरायों (Sarai) ने आवास प्रदान किया और डाक चौकियों के रूप में कार्य किया"],a:3},
{s:0,n:2,h:"निम्नलिखित में से कौन-सा विकल्प, दक्षिण, दक्षिण-पूर्वी और पूर्वी एशिया के मानसूनी क्षेत्रों में की जाने वाली गहन निर्वाह कृषि के एक अभिलक्षण की सही पहचान करता है?",ho:["गहन श्रम और बहु सस्योत्पादन के साथ छोटे खेत","स्थानांतरी कृषि और लंबी परती के साथ विरल खेत","निर्यात सस्यों और किराए के श्रमिकों के साथ विशाल रोपण","विस्तृत चराई और यंत्रीकरण के साथ बड़े खेत"],a:0},
{s:0,n:4,h:"निम्नलिखित में से कौन-सी विशेषता, सिंधु घाटी सभ्यता के नियोजित शहरी अभिन्यास को सर्वोत्तम रूप से दर्शाती है?",ho:["अनियमित विसर्पी मार्गों के अनुदिश निर्मित गृह","वृत्तीय केंद्रों के परितः अभिविन्यस्त बस्तियां","विशाल मंदिर परिसरों के आसपास संकेंद्रित भवन","समकोण पर प्रतिच्छेद करती हुई सड़कें"],a:3},
{s:0,n:5,h:"निम्नलिखित में से कौन-सा विकल्प इसकी सर्वोत्तम व्याख्या करता है कि भारत के पश्चिमी तटीय मैदान विस्तृत डेल्टाओं के स्थान पर अनेक ज्वारनदमुखों के साथ अभिलक्षित क्यों हैं?",ho:["नदियां प्रचुर मात्रा में तलछट निक्षेप लाती हैं","नदियां विस्तृत बाढ़ मैदानों से होकर बहती हैं","नदियां छोटी, तीव्र ढाल वाली और तेज-प्रवाह वाली हैं","नदियां लंबी, धीमी और विसर्पी हैं"],a:2},
{s:0,n:6,h:"किस यूरोपीय वाणिज्यिक कंपनी का मुख्य उद्देश्य विशेष रूप से मसालों के व्यापार में व्यापारिक वर्चस्व स्थापित करना था, और मालाबार क्षेत्र में इसकी महत्वपूर्ण उपस्थिति थी?",ho:["अंग्रेजी ईस्ट इंडिया कंपनी","फ्रांसीसी ईस्ट इंडिया कंपनी","डच ईस्ट इंडिया कंपनी","डेनिश ईस्ट इंडिया कंपनी"],a:2},
{s:0,n:7,h:"भारतीय राजनीति में उग्रवाद (Extremism) के उभरने का तात्कालिक कारण कौन-सी घटना थी?",ho:["मार्ले-मिंटो सुधार","प्रथम विश्व युद्ध","इल्बर्ट बिल विवाद","बंगाल का विभाजन"],a:3},
{s:0,n:8,h:"निम्नलिखित में से कौन-सा अभिलक्षण, प्राचीन भारतीय वास्तुकला में हड़प्पा कालीन शहरों के नियोजन की सर्वोत्तम व्याख्या करता है?",ho:["सुव्यवस्थित जलनिकासी व्यवस्था के साथ ग्रिड-समान सड़क विन्यास","उपासना के लिए विशाल शैलकृत गुफाएं","विस्तृत नक्काशी वाले विशाल मंदिर परिसर","धार्मिक सभाओं के लिए गुंबद वाले स्तूप"],a:0},
{s:0,n:9,h:"निम्नलिखित में से किस संविधान संशोधन द्वारा लोकसभा और राज्य विधानसभाओं के निर्वाचन के लिए मताधिकार की आयु को घटाया गया था?",ho:["44वां संविधान संशोधन अधिनियम","61वां संविधान संशोधन अधिनियम","74वां संविधान संशोधन अधिनियम","52वां संविधान संशोधन अधिनियम"],a:1},
{s:0,n:10,h:"केंद्र-राज्य संबंधों से संबंधित मुद्दों की जांच के लिए 1983 में केंद्र सरकार द्वारा निम्नलिखित में से किस आयोग का गठन किया गया था और यह संस्तुति की गई थी कि राज्यपाल की नियुक्ति पूर्णतः पक्ष-निरपेक्ष होनी चाहिए?",ho:["राजमन्नार आयोग","कोठारी आयोग","मंडल आयोग","सरकारिया आयोग"],a:3},
{s:0,n:11,h:"केंद्रीय बजट 2026-27 में भारत में मानसिक स्वास्थ्य सेवा को सुदृढ़ करने के लिए किस नए संस्थान की स्थापना का प्रस्ताव है?",ho:["एम्स-2 (AIIMS-2)","राष्ट्रीय ट्रॉमा संस्थान (National Trauma Institute)","नीति आयोग स्वास्थ्य केंद्र (NITI Aayog Health Centre)","निमहंस-2 (NIMHANS-2)"],a:3},
{s:0,n:12,h:"जून 2026 में, DRDO ने NASM-MR का पहला सफल उड़ान परीक्षण किया। यह मिसाइल किस प्रयोजन के लिए डिजाइन की गई है?",ho:["कम दूरी का सतह से हवा में मार करने वाला इंटरसेप्शन","मध्यम दूरी की नौसैनिक जहाज-रोधी स्ट्राइक","टैंक-रोधी निर्देशित स्ट्राइक","मध्यम दूरी की टैंक-रोधी निर्देशित स्ट्राइक"],a:1},
{s:0,n:13,h:"भारत के राष्ट्रीय बहुआयामी गरीबी सूचकांक (MPI) के लिए एल्किरे-फॉस्टर (Alkire-Foster) कार्यपद्धति के दोहरे-कटऑफ उपागम (dual-cutoff approach) को क्यों चुना गया?",ho:["यह सभी संकेतकों के लिए एक उभयनिष्ठ वंचन सीमा का उपयोग करता है।","यह बहुआयामी गरीबी के केवल ग्रामीण आयामों पर बल देता है।","यह वैश्विक तुलनीयता को भारत की विकास प्राथमिकताओं के साथ संयोजित करता है।","यह केवल आय-आधारित घरेलू वंचन को मापता है।"],a:2},
{s:0,n:14,h:"सूचना का अधिकार अधिनियम, 2005 के अंतर्गत छूट के संबंध में प्रायः निम्नलिखित में से किस कानून पर चर्चा की गई है?",ho:["भारतीय साक्ष्य अधिनियम, 1872","शासकीय गुप्त बात अधिनियम, 1923","प्रतिस्पर्धा अधिनियम, 2002","लोक प्रतिनिधित्व अधिनियम, 1951"],a:1},
{s:0,n:15,h:"27 फरवरी 2026 को, राष्ट्रीय सांख्यिकी कार्यालय (NSO) ने GDP के अनुमानों की एक नई श्रृंखला जारी की, जिसमें आधार वर्ष को 2011-12 से बदलकर _________ कर दिया गया है।",ho:["2020-21","2015-16","2018-19","2022-23"],a:3},
{s:0,n:17,h:"किस वैदिक जन समुदाय (Vedic assembly) में मुख्य रूप से वृद्धजन और अभिजात वर्ग शामिल थे?",ho:["समिति (Samiti)","सभा (Sabha)","विधाता (Vidatha)","गण (Gana)"],a:1},
{s:0,n:18,h:"निम्नलिखित में से कौन-सा संक्षिप्त रूप, कंप्यूटर में उपयोग किए जाने वाले कैरेक्टर एन्कोडिंग मानक के लिए प्रयुक्त होता है?",ho:["CD","LAN","RAM","ASCII"],a:3},
{s:0,n:19,h:"1855-56 में सिद्धू एवं कान्हू के नेतृत्व में कौन-सा जनजातीय विद्रोह हुआ था?",ho:["कोल विद्रोह","संथाल विद्रोह","रामोसी विद्रोह","भील विद्रोह"],a:1},
{s:0,n:20,h:"सरकार द्वारा 2026 में प्रारंभ किए गए समग्र शिशु बाल स्वास्थ्य कार्यक्रम (SSBSK) का प्राथमिक उद्देश्य क्या है?",ho:["मातृ स्वास्थ्य सहायिकी प्रदान करना","बच्चों के लिए निःशुल्क शिक्षा उपलब्ध कराना","जन्म से 36 माह तक के शिशुओं को एकीकृत स्वास्थ्य देखभाल उपलब्ध कराना","किशोर पोषण वितरित करना"],a:2},

{s:2,n:102,h:"इस प्रश्न में, एक प्रश्न के बाद दो कथन दिए गए हैं, जिन्हें (I) और (II) के रूप में क्रमांकित किया गया है। आपको यह ज्ञात करना है कि कथनों में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है या नहीं है। दोनों कथनों का अध्ययन कीजिए और उचित उत्तर का चयन कीजिए।<br><b>प्रश्न:</b> 5 खंभों, F, I, S, C और L में से प्रत्येक की लंबाई अलग-अलग है, निम्नलिखित में से कौन-सा खंभा सबसे छोटा है?<br><b>कथन:</b><br>(I) S केवल दो खंभों से लंबा है। F, S से छोटा है और I, F से छोटा है।<br>(II) C, L से लंबा है।",ho:["कथन I में दिया गया डेटा अकेले प्रश्न का उत्तर देने के लिए पर्याप्त है, जबकि कथन II में दिया गया डेटा अकेले प्रश्न का उत्तर देने के लिए पर्याप्त नहीं है।","कथन I और II में दिया गया डेटा संयुक्त रूप से (न तो अकेले कथन I या न अकेले कथन II) प्रश्न का उत्तर देने के लिए पर्याप्त है।","कथन I और II में दिया गया डेटा संयुक्त रूप से प्रश्न का उत्तर देने के लिए पर्याप्त नहीं है।","कथन II में दिया गया डेटा अकेले प्रश्न का उत्तर देने के लिए पर्याप्त है, जबकि कथन I में दिया गया डेटा अकेले प्रश्न का उत्तर देने के लिए पर्याप्त नहीं है।"],a:0},

{s:2,n:114,h:"इस प्रश्न में, एक प्रश्न के बाद (I) और (II) से क्रमांकित दो कथन दिए गए हैं। आपको यह तय करना है कि कथनों में दिया गया डेटा प्रश्न का उत्तर देने के लिए पर्याप्त है या नहीं। दोनों कथन का अध्ययन कीजिए और उपयुक्त उत्तर का चयन कीजिए।<br><b>प्रश्न:</b> 5 छड़ों E, J, N, C और K में से प्रत्येक की लंबाई अलग-अलग है, इनमें से कौन-सी छड़ सबसे छोटी है?<br><b>कथन:</b> (I) K, C से लंबी है।<br><b>कथन:</b> (II) केवल एक छड़, E से छोटी है। E, C से छोटी है परंतु J से लंबी है।",ho:["कथन II में दिया गया डेटा अकेले प्रश्न का उत्तर देने के लिए पर्याप्त है, जबकि कथन I में दिया गया डेटा पर्याप्त नहीं है","कथन I में दिया गया डेटा अकेले प्रश्न का उत्तर देने के लिए पर्याप्त है, जबकि कथन II में दिया गया डेटा पर्याप्त नहीं है","कथन I और II दोनों एक साथ (और न तो अकेले कथन I या न ही अकेले कथन II) प्रश्न का उत्तर देने के लिए पर्याप्त हैं","कथन I और II दोनों एक साथ प्रश्न का उत्तर देने के लिए पर्याप्त नहीं हैं"],a:0},
{s:2,n:115,h:"ललित, बिंदु A से चलना शुरू करता है और उत्तर की ओर 75 km गाड़ी चलाता है। फिर वह बाएं मुड़ता है और 80 km गाड़ी चलाता है, वह फिर बाएं मुड़ता है और 85 km गाड़ी चलाता है। फिर वह बाएं मुड़ता है और 89 km गाड़ी चलाता है। अंत में वह बाएं मुड़ता है और 10 km गाड़ी चलाकर बिंदु P पर रुक जाता है। बिंदु A पर वापस पहुँचने के लिए उसे कितनी दूरी (न्यूनतम दूरी) तक और किस दिशा में गाड़ी चलानी चाहिए? (जब तक निर्दिष्ट न हो, सभी मोड़ केवल 90-डिग्री के मोड़ हैं।)",ho:["11 km, पूर्व की ओर","9 km, पश्चिम की ओर","10 km, पश्चिम की ओर","8 km, पश्चिम की ओर"],a:1},
{s:2,n:117,h:"शब्द IGNITION में प्रत्येक स्वर को अंग्रेजी वर्णमाला क्रम में उसके ठीक पहले वाले अक्षर से बदल दिया जाता है और प्रत्येक व्यंजन को अंग्रेजी वर्णमाला क्रम में उसके ठीक बाद वाले अक्षर से बदल दिया जाता है। इस प्रकार बने अक्षरों के समूह में निम्नलिखित में से कौन-सा अक्षर दो बार से अधिक दिखाई देगा?",ho:["Z","O","U","H"],a:3},
{s:2,n:118,h:"A × Y का अर्थ है कि, “A, Y की माता है”।<br>A – Y का अर्थ है कि, “A, Y की पुत्री है”।<br>A $ Y का अर्थ है कि, “A, Y का पिता है”।<br>A @ Y का अर्थ है कि, “A, Y का पति है”।<br>यदि 'B @ Z – E $ Q' है, तो B का Q से क्या संबंध है?",ho:["पुत्र की पत्नी","भाई की पत्नी","पिता की बहन","बहन का पति"],a:3},
{s:2,n:119,h:"निम्नलिखित संख्या, प्रतीक श्रृंखला का संदर्भ लीजिए और नीचे दिए गए प्रश्न का उत्तर दीजिए। गिनती केवल बाएं से दाएं की जानी है। सभी संख्याएं एकल अंकों की संख्याएं हैं।<br><b>(बाएं) * £ 8 € @ 1 8 8 © & 1 1 1 7 * 4 7 2 8 $ 8 & (दाएं)</b><br>ऐसे कितने प्रतीक हैं, जिनमें से प्रत्येक के ठीक पहले एक संख्या है और ठीक बाद में भी एक संख्या है?",ho:["1","3","2","4"],a:2},
{s:2,n:120,h:"एक निश्चित कूट भाषा में, ‘CROW’ को ‘9863’ और ‘WORK’ को ‘3289’ के रूप में कूटबद्ध किया गया है। दी गई कूट भाषा में ‘K’ का कूट क्या है?",ho:["8","2","9","3"],a:1},
{s:2,n:104,h:"अंग्रेजी वर्णमाला क्रम पर आधारित दी गई श्रृंखला में ? के स्थान पर क्या आना चाहिए?<br><b>EKP GMR IOT KQV ?</b>",e:"Based on the English alphabetical order, what should come in place of ? in the given series?<br><b>EKP GMR IOT KQV ?</b>",ho:["MRY","MSX","MRX","MSY"],a:1},
{s:2,n:116,h:"दी गई श्रृंखला में प्रश्न-चिह्न (?) के स्थान पर क्या आना चाहिए?<br><b>74 75 67 94 30 ?</b>",e:"What should come in place of the question mark (?) in the given series?<br><b>74 75 67 94 30 ?</b>",ho:["264","246","155","165"],a:2}
];
const SN=["General Awareness","Mathematics","Reasoning"],TOTAL=5400,NEG=0.33;
let L="hi",c=0,sec=0,rem=TOTAL,done=false,T;
const N=Q.length,A=Array(N).fill(null),M=Array(N).fill(0),V=Array(N).fill(0),TM=Array(N).fill(0);V[0]=1;
const $=id=>document.getElementById(id),fm=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const txt=(q,k)=>k=="q"?(L=="en"&&q.e?q.e:q.h):(L=="en"&&q.eo?q.eo:q.ho);
function st(i){return A[i]!=null&&M[i]?"am":M[i]?"m":A[i]!=null?"a":V[i]?"n":""}
function shell(){document.getElementById("app").innerHTML=`<header><b>RRB NTPC UG CBT-II</b><span class="tm" id="tm"></span><button onclick="lang()" id="lb"></button></header>
<div class="tabs" id="tabs"></div><div class="wrap"><div class="main"><div class="card"><div class="qh"><span id="qn"></span><span id="qt"></span></div><div class="q" id="qq"></div><div id="op"></div></div></div>
<div class="side"><div class="card"><div class="pal" id="pal"></div><div class="lg">🟩 Answered · 🟥 Not answered · 🟪 Review · ⬜ Not visited</div></div></div></div>
<footer><button onclick="mv(-1)">◀ Previous</button><button class="v" onclick="mark()">Mark for Review &amp; Next</button><button onclick="clr()">Clear</button><button class="g" onclick="save()">Save &amp; Next</button><button class="p" onclick="submit()">Submit Test</button></footer>`}
function draw(){const q=Q[c];sec=q.s;$("lb").textContent=L=="hi"?"हिंदी → English":"English → हिंदी";
$("tabs").innerHTML=SN.map((s,i)=>{const k=Q.filter(x=>x.s==i).length;return k?`<button class="${i==sec?"on":""}" onclick="go(${Q.findIndex(x=>x.s==i)})">${s} (${k})</button>`:""}).join("");
$("qn").textContent=`${SN[q.s]} · Q.${c+1}/${N} (मूल Q.${q.n})`;$("qq").innerHTML=txt(q,"q");
$("op").innerHTML=txt(q,"o").map((o,i)=>`<div class="o ${A[c]==i?"s":""}" onclick="pick(${i})"><i>${"ABCD"[i]}.</i><span>${o}</span></div>`).join("");
$("pal").innerHTML=Q.map((x,i)=>x.s==sec?`<button class="${st(i)} ${i==c?"cur":""}" onclick="go(${i})">${i+1}</button>`:"").join("");qt()}
function qt(){$("tm").textContent="⏱ "+fm(rem);$("qt").textContent="इस प्रश्न पर: "+fm(TM[c])}
function go(i){c=i;V[i]=1;draw()}function mv(d){const i=c+d;if(i>=0&&i<N)go(i)}
function pick(i){A[c]=i;draw()}function clr(){A[c]=null;M[c]=0;draw()}
function save(){M[c]=0;c<N-1?go(c+1):draw()}function mark(){M[c]=1;c<N-1?go(c+1):draw()}
function lang(){L=L=="hi"?"en":"hi";done?result():draw()}
function submit(){const a=A.filter(x=>x!=null).length,m=M.filter(x=>x).length;if(confirm(`Answered: ${a}\nNot answered: ${N-a}\nMarked for review: ${m}\n\nTest submit karna hai?`))finish()}
function finish(){clearInterval(T);done=true;result()}
function result(){let R=SN.map(()=>({c:0,w:0,u:0,t:0}));Q.forEach((q,i)=>{const r=R[q.s];A[i]==null?r.u++:A[i]==q.a?r.c++:r.w++;r.t++});
const S=R.reduce((a,r)=>({c:a.c+r.c,w:a.w+r.w,u:a.u+r.u}),{c:0,w:0,u:0}),sc=(S.c-S.w*NEG).toFixed(2),used=TOTAL-rem;
$("app").innerHTML=`<header><b>Result · RRB NTPC UG CBT-II</b><button onclick="lang()">${L=="hi"?"English":"हिंदी"}</button></header><div class="wrap" style="padding-top:12px"><div class="main" style="flex-basis:100%">
<div class="card"><div class="st"><div><b>${sc} / ${N}</b>Score</div><div><b style="color:var(--g)">${S.c}</b>Sahi (+1)</div><div><b style="color:var(--r)">${S.w}</b>Galat (−${NEG})</div><div><b>${S.u}</b>Unattempted</div><div><b>${fm(used)}</b>Time used</div><div><b>${S.c+S.w?Math.round(S.c/(S.c+S.w)*100):0}%</b>Accuracy</div></div></div>
<div class="card"><table><tr><th>Section</th><th>Sahi</th><th>Galat</th><th>Skip</th><th>Score</th></tr>${R.map((r,i)=>r.t?`<tr><td>${SN[i]}</td><td>${r.c}</td><td>${r.w}</td><td>${r.u}</td><td>${(r.c-r.w*NEG).toFixed(2)}</td></tr>`:"").join("")}</table></div>
${Q.map((q,i)=>`<div class="card"><div class="qh"><span>${SN[q.s]} · Q.${i+1} (मूल Q.${q.n})</span><span>⏱ ${fm(TM[i])} · ${A[i]==null?"Skipped":A[i]==q.a?"✔ +1":"✘ −"+NEG}</span></div><div class="q">${txt(q,"q")}</div>${txt(q,"o").map((o,j)=>`<div class="o ${j==q.a?"ok":j==A[i]?"no":""}"><i>${"ABCD"[j]}.</i><span>${o}${j==A[i]?" ← aapka":""}</span></div>`).join("")}</div>`).join("")}
<button class="p" onclick="location.reload()">Dobara Test Do</button></div></div>`;window.scrollTo(0,0)}
shell();draw();T=setInterval(()=>{rem--;TM[c]++;if(rem<=0){rem=0;finish()}else qt()},1000);
</script></body></html>
